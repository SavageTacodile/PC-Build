<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Learn how to clean, update, and monitor your PC.">
    <title>Build a Custom PC - Maintenance</title>
</head>
<body>
<a class="skip-link" href="#wrapper">Skip to main content</a>
<header id="header">
    <a href="index.html">
        <img src="pc-building-guide-logo.png" alt="PC Building Guide logo - go to home page">
    </a>
    <h1>PC Maintenance</h1>
</header>

<main id="wrapper" tabindex="-1">

    <div class="maintenance-buttons">
        <button type="button" onclick="showMaintenance('cleaning')">Cleaning</button>
        <button type="button" onclick="showMaintenance('temperatures')">Temperatures</button>
        <button type="button" onclick="showMaintenance('updates')">Updates</button>
        <button type="button" onclick="showMaintenance('thermal')">Thermal Paste</button>
        <button type="button" onclick="showMaintenance('schedule')">Schedule</button>
    </div>

    <div id="maintenance-box" aria-live="polite">
        <h2>PC Maintenance</h2>
        <p>
            Select a button to learn about things you can do to keep your PC maintained.
        </p>
    </div>
    <p><a href="troubleshooting.html" class="cta-button">Next: Fix Common PC Issues →</a></p>
</main>

<hr>

<footer id="footer">
    <p><b>PC Building Guide</b></p>
    <nav aria-label="Site pages">
        <p>
            <a href="index.html">Home</a> |
            <a href="components.html">Components</a> |
            <a href="assembly.html">Assembly</a> |
            <a href="maintenance.html" class="active" aria-current="page">Maintenance</a> |
            <a href="troubleshooting.html">Troubleshooting</a> |
            <a href="contact.html">Contact</a>
        </p>
    </nav>
</footer>

<script>
    
function showMaintenance(topic) {
    var maintenanceBox = document.getElementById("maintenance-box");

    if (topic == "cleaning") {
        maintenanceBox.innerHTML = `
            <h2>Cleaning Your PC</h2>

            <p>
            If you don't clean out dust inside your computer regularly, it can cause your fans to work harder to keep your components cooled down. 
            </p>

            <ul>
                <li>Turn off and unplug your PC.</li>
                <li>
                Use compressed air to blow out the dust from vents, fans, and all the components <strong>Important:</strong> do not let the air spin the fan blades. Hold the fan blades while you are dusting them.
                </li>
                <li>Clean the dust filters on the chassis if you have any.</li>
                <li>Do not use a vacuum.</li>
            </ul>
        `;
    }
        
    else if (topic == "temperatures") {
        maintenanceBox.innerHTML = `
            <h2>Checking Temperatures</h2>
        
            <p>
                Checking your CPU and GPU temperatures can help you see if your computer is cooling well or not.
            </p>

            <p>
                Use a monitoring tool such as <a href="https://www.hwinfo.com" target="_blank" rel="noopener noreferrer">HWiNFO</a> to check your CPU and GPU temperatures while idle and under load.
            </p>
        `;
    }

    else if (topic == "updates") {
        maintenanceBox.innerHTML = `
            <h2>Software and Driver Updates</h2>

            <p>
                It's crucial to keep Windows and your drivers updated to keep security, performance, and compatibility working efficiently.
            </p>

            <ul>
                <li>Regularly check Windows Update.</li>
                <li>Keep your graphics card drivers updated.</li>
                <li>Update your most used programs when you are notified of new releases.</li>
                <li>Restart your computer when notified after updates.</li>
            </ul>
        `;
    }

    else if (topic == "thermal") {
        maintenanceBox.innerHTML = `
            <h2>Thermal Paste</h2>

            <p>
                Thermal paste can degrade over time. Personally, I replace mine once a year. If you're experiencing high temperatures after a long period of time, it may be time to reapply it (after cleaning the old paste off).
            </p>
        `;
    }
    
    else if (topic == "schedule") {
        maintenanceBox.innerHTML = `
            <h2>Maintenance Schedule</h2>

            <table>
                <tr>
                    <th>Maintenance Task</th>
                    <th>How Often</th>
                </tr>

                <tr>
                    <td>Clean dust filters</td>
                    <td>Every 1 to 2 months</td>
                </tr>

                <tr>
                    <td>Clean inside the PC</td>
                    <td>Every 3 to 6 months</td>
                </tr>

                <tr>
                    <td>Check temperatures</td>
                    <td>Every few months</td>
                </tr>

                <tr>
                    <td>Check for software updates</td>
                    <td>Monthly</td>
                </tr>
            </table>
        `;
    }
}
</script>

<script>
    let lastScroll = 0;
    const footer = document.getElementById('footer');

    window.addEventListener('scroll', () => {
        const current = window.scrollY;
        const atBottom = window.innerHeight + current >= document.body.scrollHeight - 10;

        if (current > lastScroll && current > 50 && !atBottom) {
            footer.classList.add('hidden');
        } else {
            footer.classList.remove('hidden');
        }
        lastScroll = current;
    }, { passive: true });
</script>  
    
</body>
</html>
